name: Flight probe (temporal)

on:
  push:
    branches: [claude/airport-price-monitoring-agent-cptbua]
    paths: [flight-price-agent/tools/**, .github/workflows/flight-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flight-price-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/probe_google_flights.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: flight-price-agent/probe_*.png
